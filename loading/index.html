:root{--ink:#1e2430;--navy:#1f2d4d;--line:#d3d7df;--soft:#f3f4f7;--ok:#2f6b3f;--bad:#a03030;--warn:#8a5a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'K',system-ui,sans-serif;color:var(--ink);background:#fafafb;font-size:15px;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 14px}
header .r{display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0}
header small{opacity:.8;font-size:12px}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0}
main{padding:12px;max-width:720px;margin:auto}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ck.auto{opacity:.9}.ck .au{display:block;font-size:11.5px;color:#6b7280}
.sh{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.sh .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--soft);color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.sec.done .num{background:var(--navy);color:#fff}
.sh .ic{color:var(--navy);flex:0 0 32px}
.sh h3{margin:0;font-size:15px;flex:1;color:var(--navy)}
.sh .st{font-size:12px;color:#777}
.sec.done .st{color:var(--ok)}
.sb{padding:4px 12px 12px;border-top:1px solid var(--line);display:none}
.sec.open .sb{display:block}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px dashed #e6e8ec}
label.ck input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--navy)}
.f{margin:9px 0}
.f > span{display:block;font-size:13px;color:#555;margin-bottom:3px}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:110px;direction:ltr;text-align:left}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
span.ltr,b.ltr{text-align:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;border:1px solid var(--navy);color:var(--navy);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.p{background:var(--navy);color:#fff}
.btn.w{width:100%}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.slot{width:calc(50% - 4px);border:1px dashed #b9bfca;border-radius:8px;padding:6px;text-align:center;font-size:12.5px;color:#555;position:relative;background:var(--soft)}
.slot.has{border-style:solid;border-color:var(--ok);background:#fff}
.slot img{width:100%;height:110px;object-fit:cover;border-radius:6px;display:block;margin-bottom:4px}
.slot .fi{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}
.slot .pick{all:unset;display:block;width:100%;padding:8px 0;cursor:pointer;font:inherit;font-size:12.5px;color:#444}
.slot .pst{font-size:11.5px;color:var(--warn)}
.err{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#f8e9e9;color:var(--bad);font-size:12px;padding:8px 10px;direction:ltr;text-align:left;white-space:pre-wrap}
.slot .x{position:absolute;top:4px;left:4px;background:#fff;border:1px solid var(--line);border-radius:50%;width:24px;height:24px;line-height:20px;font-size:14px}
.msg{font-size:13px;padding:6px 9px;border-radius:6px;margin:6px 0}
.msg.bad{background:#f8e9e9;color:var(--bad)}
.msg.ok{background:#e9f2eb;color:var(--ok)}
.msg.warn{background:#f7f0e1;color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:14px;padding:6px 14px;cursor:pointer;background:#fff}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
canvas.sig{width:100%;height:170px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none}
.foot{display:grid;gap:8px;margin:14px 0 40px}
.lock{font-size:12.5px;color:var(--bad);margin:4px 0}
#hist .it{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0;font-size:13.5px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.dbox{background:#fff;border-radius:12px;padding:16px;max-width:360px;width:100%}
.dbox p{margin:0 0 14px;font-weight:700}
.pg794{width:794px;height:1123px;position:relative;background:#fff;overflow:hidden;margin-bottom:10px}
.pg794 .lh-head,.pg794 .lh-foot{position:absolute}
.pg794 .pbody{position:absolute;top:36mm;bottom:28mm;left:0;right:0;padding:0 10mm;overflow:hidden;max-width:none}
.pg794 .pbody > div{break-inside:avoid}
.pg794 .lh-head{height:33mm;padding:6mm 12mm 0}.pg794 .lh-head .in{height:23mm}.pg794 .lh-head .lg{height:23mm}.pg794 .lh-head .tx{height:18mm;max-width:none}
.pg794 .lh-foot{height:24mm;flex-direction:row;gap:8mm;padding:3mm 12mm 0}.pg794 .lh-foot > div{white-space:nowrap}
/* report */
#rep{display:none;background:#fff}
.rp{max-width:800px;margin:auto;padding:16px;font-size:12.5px}
.rp .hd{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 8px}
.rp h2{margin:0;color:var(--navy);font-size:19px}
.rp h4{margin:12px 0 5px;color:var(--navy);border-right:4px solid var(--navy);padding-right:7px;font-size:14px}
.rp table{width:100%;border-collapse:collapse}
.rp td,.rp th{border:1px solid var(--line);padding:4px 6px;text-align:right;vertical-align:top}
.rp th{background:var(--soft);width:30%}
.rp .pics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.rp .pics figure{margin:0;border:1px solid var(--line);padding:3px;break-inside:avoid}
.rp .pics img{width:100%;height:150px;object-fit:cover}
.rp figcaption{font-size:10.5px;text-align:center}
.rp .pb{break-before:page;padding-top:4px}
.rp .yes{color:var(--ok);font-weight:700}.rp .no{color:var(--bad);font-weight:700}
.noprint{position:sticky;top:0;background:var(--navy);padding:8px;display:flex;gap:8px;justify-content:center}
.noprint .btn{background:#fff}

.lh-head{position:fixed;top:0;left:0;right:0;height:33mm;padding:6mm 12mm 0;background:#fff;z-index:2}
.lh-head .in{display:flex;justify-content:space-between;align-items:center;height:23mm}
.lh-head .lg{height:23mm}
.lh-head .tx{height:18mm}
.lh-head .ln{height:1.1mm;background:#11254f;margin-top:1.4mm}
.lh-head .ln2{height:.6mm;background:#d9822b;margin-top:.4mm}
.lh-foot{position:fixed;bottom:0;left:0;right:0;height:24mm;background:#0b1f4b;color:#fff;z-index:2;
  border-top:1.2mm solid #d9822b;background:linear-gradient(to bottom,#2e8b3a 0,#2e8b3a .8mm,#0b1f4b .8mm,#0b1f4b 100%);
  display:flex;justify-content:space-between;gap:8mm;padding:3mm 12mm 0;font-size:7pt;line-height:1.5}
.lh-head,.lh-foot,.lh-foot *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lh-foot > div{white-space:nowrap}
.lh-foot b{color:#e8913a;font-weight:700}
.lh-foot .en{direction:ltr;text-align:left}
.lh-foot .ar{direction:rtl;text-align:right}
table.lay{width:100%;border-collapse:collapse}
table.lay > thead td,table.lay > tfoot td,table.lay > tbody > tr > td{padding:0;border:0}
.lay-sp-h{height:36mm}
.lay-sp-f{height:28mm}

@media screen{.lh-head,.lh-foot{position:static}.lh-head{height:auto;padding:4mm}.lh-head .lg{height:20mm}.lh-head .tx{height:auto;max-width:68%}.lh-head .in{height:auto}.lh-foot{height:auto;flex-direction:column;gap:2mm;padding:3mm 4mm}.lh-foot > div{white-space:normal}.lay-sp-h,.lay-sp-f{height:0}}
@media print{@page{size:A4;margin:0}.rp{max-width:none;padding:0 10mm}.noprint{display:none!important}body{background:#fff}}

<header><div class="r"><div><h1>شيك ليست التحميل</h1><small id="hsub">AL RASHED · حاوية جديدة</small></div><small id="pct">0%</small></div><div class="bar"><i id="bar"></i></div></header>

      </div>
      <div class="g2">
        <label class="f"><span>عدد البالتات</span><input type="number" inputmode="numeric" data-k="expPal"></label>
        <label class="f"><span>رقم السيارة</span><input type="text" data-k="truck"></label>
      </div>
    </div>
  </div>
  <div id="steps"></div>
  <div class="foot">
    <div id="missing"></div>
    <button class="btn p w" onclick="finish()">إنهاء وإصدار التقرير</button>
    <div class="g2"><button class="btn" onclick="newCont()">حاوية جديدة</button><button class="btn" onclick="showHist()">الحاويات السابقة</button></div>
    <div id="hist"></div>
    <div id="saveNote" class="msg warn" style="display:none"></div>
  </div>
</main>
</div>

const AUTO = {photos:{0:['out','out2'],1:['unit'],2:['in','in4','in2','in5','in3','in6']},drain:{1:['drain']},logger:{3:['logger','label']},lot:{1:['last'],3:['samples']},seal:{0:['seal']},driver:{0:['face','__sig']}};
function autoOk(id,j){const a=(AUTO[id]||{})[j];return a?a.every(k=>k==='__sig'?!!S.sig:!!S.ph[k]):null}
const REQ_FIELDS = {logger:['logger'],lot:['lots'],driver:['drvName']};

let S = blank();
function blank(){return {id:Date.now(),prod:'',f:{date:new Date().toISOString().slice(0,10)},c:{},ph:{},sig:'',done:false}}
const $=s=>document.querySelector(s);
function esc(t){return String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function build(){
  let h='';
  STEPS.forEach((s,i)=>{
    const ex=EXTRA[s.id]||{};
    h+=`<div class="sec" id="sec-${s.id}"><div class="sh" onclick="tog('sec-${s.id}')"><div class="num">${i+1}</div><div class="ic">${ICONS[s.icon]}</div><h3>${s.t}</h3><span class="st" id="st-${s.id}"></span></div><div class="sb">`;
    if(s.id==='seal') h+=`<div class="lock" id="lockmsg"></div>`;
    s.p.forEach((p,j)=>{const au=(AUTO[s.id]||{})[j];h+=`<label class="ck${au?' auto':''}"><input type="checkbox" data-c="${s.id}.${j}"${au?' onclick="return false"':''}><span>${p}${au?'<small class="au">📷 تتعلّم تلقائي بعد الصورة</small>':''}</span></label>`});
    if(ex.temps){
      h+=`<label class="f"><span>حرارة الثمرة — معاينة واحدة °C *</span><input type="text" class="ltr" data-k="t0" placeholder="مثال: 5 أو -18"></label><div id="tmsg"></div>`;
    }
    (ex.fields||[]).forEach(([k,l,t])=>{h+=`<label class="f"><span>${l}</span><input type="${t}" class="${t==='text'?'ltr':''}" data-k="${k}"></label>`});
    if(ex.hint) h+=`<div id="gmsg"></div>`;
    if(ex.lots){
      h+=`<label class="f"><span>أرقام اللوطات في الحاوية (افصل بفاصلة) *</span><input type="text" class="ltr" data-k="lots"></label>
      <div class="f"><span>اللوطات على آخر 4 بالتات عند الباب</span><div class="g2">
      ${[1,2,3,4].map(n=>`<input type="text" class="ltr" data-k="l${n}" placeholder="بالتة ${n}">`).join('')}</div></div>
      <label class="f"><span>عدد كراتين العينة المسلَّمة للسائق</span><input type="number" inputmode="numeric" data-k="samples"></label><div id="lmsg"></div>`;
    }
    if(ex.photos) h+=photoSlots(ex.photos);
    if(ex.driver){
      h+=`<label class="f"><span>اسم السائق *</span><input type="text" data-k="drvName"></label>
      <label class="f"><span>رقم تليفون / رخصة السائق</span><input type="text" class="ltr" data-k="drvId"></label>
      <div class="f"><span>توقيع السائق بالاستلام *</span><canvas class="sig" id="sig"></canvas>
      <button class="btn" type="button" onclick="clearSig()" style="margin-top:6px">مسح التوقيع</button></div>`+photoSlots([['face','صورة وجه السائق مع الورقة *']]);
    }
    h+=`</div></div>`;
  });
  $('#steps').innerHTML=h;
  initSig();
}
function photoSlots(list){
  return `<div class="ph">`+list.map(([k,l])=>`<div class="slot" id="slot-${k}"><div class="pv"></div><button type="button" class="pick" data-pick="${k}">📷 ${l}</button><div class="pst"></div><input type="file" accept="image/*" class="fi" data-ph="${k}"></div>`).join('')+`</div>`;
}
function tog(id){$('#'+id).classList.toggle('open')}

// ---------- state binding ----------
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k){S.f[t.dataset.k]=t.value;changed()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.c){S.c[t.dataset.c]=t.checked;changed()}
  if(t.dataset.ph){const k=t.dataset.ph,f=t.files&&t.files[0];if(!f){pst(k,'ما اتختارتش صورة — جرّب تاني');return}
    pst(k,'⏳ جاري حفظ الصورة…');
    shrink(f).then(d=>{S.ph[k]=d;pst(k,'');renderPh();changed();phPut(k,d)}).catch(err=>{pst(k,'⚠ الصورة ما اتقريتش — صوّر تاني أو اختار من الألبوم');showErr('photo '+k+': '+(err&&err.message||err))})}
});
$('#prod').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;S.prod=c.dataset.v;changed()});

// الصورة: objectURL (أخف على ذاكرة الآيفون من FileReader) ← canvas مصغّر ← JPEG
function shrink(file){return new Promise((res,rej)=>{let u;try{u=URL.createObjectURL(file)}catch(e){return rej(e)}
  const im=new Image();
  im.onload=()=>{try{const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;const m=1000,sc=Math.min(1,m/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',0.62);URL.revokeObjectURL(u);
    if(!d||d.length<100)return rej(new Error('empty'));res(d)}catch(e){URL.revokeObjectURL(u);rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};im.src=u})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const inp=document.querySelector('[data-ph="'+b.dataset.pick+'"]');if(inp){inp.value='';inp.click()}});
function pst(k,t){const el=document.querySelector('#slot-'+k+' .pst');if(el)el.textContent=t||''}
function renderPh(){
  document.querySelectorAll('.slot').forEach(sl=>{const k=sl.id.slice(5);const d=S.ph[k];
    sl.classList.toggle('has',!!d);
    sl.querySelector('.pv').innerHTML=d?`<img src="${d}"><button class="x" type="button" onclick="event.stopPropagation();delPh('${k}')">×</button>`:''});
}
function delPh(k){delete S.ph[k];phPut(k,null);renderPh();changed()}

// ---------- signature ----------
let sctx,drawing=false;
function initSig(){
  const c=$('#sig');if(!c)return;
  const fit=()=>{const r=c.getBoundingClientRect();if(!r.width)return;c.width=r.width*2;c.height=r.height*2;sctx=c.getContext('2d');sctx.scale(2,2);sctx.lineWidth=2.2;sctx.lineCap='round';sctx.strokeStyle='#1e2430';
    if(S.sig){const im=new Image();im.onload=()=>sctx.drawImage(im,0,0,r.width,r.height);im.src=S.sig}};
  new ResizeObserver(fit).observe(c);
  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);const[x,y]=pos(e);sctx.beginPath();sctx.moveTo(x,y)});
  c.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);sctx.lineTo(x,y);sctx.stroke()});
  const end=()=>{if(!drawing)return;drawing=false;S.sig=c.toDataURL('image/png');phPut('__sig',S.sig);changed()};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function drawSig(){const c=$('#sig');if(!c||!sctx||!S.sig)return;const r=c.getBoundingClientRect();const im=new Image();im.onload=()=>sctx.drawImage(im,0,0,r.width,r.height);im.src=S.sig}
function clearSig(){const c=$('#sig');sctx.clearRect(0,0,c.width,c.height);S.sig='';phPut('__sig',null);changed()}

// ---------- logic ----------
function pallets(){return (S.f.palList||'').split(/[\n,،]+/).map(x=>x.trim()).filter(Boolean)}
function lots(){return (S.f.lots||'').split(/[,،\s]+/).map(x=>x.trim()).filter(Boolean)}
function num(v){if(v===undefined||v===null)return NaN;v=String(v).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[−–ـ]/g,'-');return v===''?NaN:Number(v)}
function temps(){const v=num(S.f.t0);return isNaN(v)?[]:[v]}
function tempLimit(){ if(S.prod==='frozen') return -18; const sp=num(S.f.setp); return isNaN(sp)?null:sp+2 }

function stepIssues(s){
  const iss=[];
  s.p.forEach((p,j)=>{const a=autoOk(s.id,j);if(a===null&&!S.c[s.id+'.'+j]) iss.push('علامة: '+p.replace(/<[^>]+>/g,''))});
  const ex=EXTRA[s.id]||{};
  (ex.photos||[]).forEach(([k,l])=>{if(!S.ph[k]) iss.push('صورة: '+l)});
  (REQ_FIELDS[s.id]||[]).forEach(k=>{if(!(S.f[k]||'').trim()) iss.push('بيان ناقص')});
  if(ex.temps){const t=temps();const lim=tempLimit();
    if(!t.length) iss.push('تسجيل حرارة الثمرة');}
  if(ex.driver){ if(!S.sig) iss.push('توقيع السائق'); if(!S.ph.face) iss.push('صورة وجه السائق'); }
  if(s.id==='lot'){const L=lots();
    if(L.length>1){const last=[1,2,3,4].map(n=>(S.f['l'+n]||'').trim());const miss=L.filter(l=>!last.includes(l));if(miss.length) iss.push('لوط غير موجود في آخر 4 بالتات: '+miss.join(', '))}
    const sm=parseInt(S.f.samples);if(L.length&&!(sm>=L.length)) iss.push('عينات أقل من عدد اللوطات');}
  return iss;
}
function dups(a){const s=new Set,d=new Set;a.forEach(x=>{s.has(x)?d.add(x):s.add(x)});return[...d]}
function infoIssues(){const i=[];if(!S.prod)i.push('اختيار الصنف');if(!(S.f.cont||'').trim())i.push('رقم الحاوية');
  if(isNaN(num(S.f.setp)))i.push('درجة الحجز');return i}

function changed(){
  document.querySelectorAll('#prod .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===S.prod));
  document.querySelectorAll('[data-c]').forEach(el=>{const [id,j]=el.dataset.c.split('.');const a=autoOk(id,+j);if(a!==null){el.checked=a;S.c[el.dataset.c]=a}});
  let total=STEPS.length+1,ok=0;
  const ii=infoIssues();$('#sec-info').classList.toggle('done',!ii.length);$('#st-info').textContent=ii.length?'ناقص':'✓';if(!ii.length)ok++;
  let before8=true;
  STEPS.forEach((s,i)=>{const iss=stepIssues(s);const d=!iss.length;if(d)ok++;if(i<8&&!d)before8=false;
    $('#sec-'+s.id).classList.toggle('done',d);$('#st-'+s.id).textContent=d?'✓ تم':(iss.length+' ناقص')});
  const lm=$('#lockmsg');if(lm) lm.textContent=before8?'':'⚠ لا تقفل الباب — لسه فيه خطوات ناقصة من 1 إلى 8.';
  // temp message
  const t=temps(),lim=tempLimit(),tm=$('#tmsg');
  if(tm){ tm.innerHTML=(t.length&&lim!==null&&t[0]>lim)?`<div class="msg warn">للعلم: الحرارة <span class="ltr">${t[0]}°C</span> أعلى من <span class="ltr">${lim}°C</span> — تتسجل في التقرير والتحميل مستمر.</div>`:''}
  const gm=$('#gmsg');if(gm) gm.innerHTML='<div class="msg warn">الجهاز يوضع في الباليت قبل الأخير — فوق — داخل الكرتونة.</div>';
  const lmm=$('#lmsg');if(lmm){const L=lots();lmm.innerHTML=L.length?`<div class="msg ${L.length>1?'warn':'ok'}">عدد اللوطات: ${L.length}${L.length>1?' — لازم كل لوط يظهر في آخر 4 بالتات، وكرتونة عينة من كل لوط.':''}</div>`:''}
  const lo=document.querySelector('[data-k=lineOther]');if(lo) lo.style.display=S.f.line==='أخرى'?'block':'none';
  const p=Math.round(ok/total*100);$('#pct').textContent=p+'%';$('#bar').style.width=p+'%';
  $('#hsub').textContent='AL RASHED · '+(S.f.cont?S.f.cont.toUpperCase():'حاوية جديدة');
  save();
}

// ---------- storage ----------
const KEY='alr_loading_cur',HK='alr_loading_hist';
// الصور والتوقيع في IndexedDB (مساحة كبيرة) — والبيانات النصية في localStorage
let DB=null,IDB_OK=true;
function idb(){if(DB)return Promise.resolve(DB);return new Promise((ok,no)=>{try{const r=indexedDB.open('alr_loading',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>{DB=r.result;ok(DB)};r.onerror=()=>no(r.error)}catch(e){no(e)}})}
async function phPut(k,v){try{const db=await idb();await new Promise((ok,no)=>{const t=db.transaction('ph','readwrite');v?t.objectStore('ph').put(v,S.id+':'+k):t.objectStore('ph').delete(S.id+':'+k);t.oncomplete=ok;t.onerror=()=>no(t.error)});IDB_OK=true}catch(e){IDB_OK=false}note()}
async function phLoadAll(id){try{const db=await idb();return await new Promise((ok,no)=>{const out={};const t=db.transaction('ph','readonly');const c=t.objectStore('ph').openCursor(IDBKeyRange.bound(id+':',id+':\uffff'));
  c.onsuccess=()=>{const r=c.result;if(r){out[r.key.slice(String(id).length+1)]=r.value;r.continue()}else ok(out)};c.onerror=()=>no(c.error)})}catch(e){IDB_OK=false;return {}}}
async function phClear(id){try{const db=await idb();const t=db.transaction('ph','readwrite');t.objectStore('ph').delete(IDBKeyRange.bound(id+':',id+':\uffff'))}catch(e){}}
function note(){const n=$('#saveNote');if(!n)return;n.style.display=IDB_OK?'none':'block';n.textContent='تنبيه: الجهاز مش بيحفظ الصور — ما تقفلش الصفحة قبل «إصدار التقرير» وحفظ الـ PDF. (افتح اللينك في كروم أو سفاري مش جوه تطبيق تاني)'}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...S,ph:{},sig:''}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)S=Object.assign(blank(),d,{ph:{},sig:''})}catch(e){}}
async function loadMedia(){const m=await phLoadAll(S.id);S.sig=m.__sig||'';delete m.__sig;S.ph=m;renderPh();drawSig();changed();note()}
function fill(){
  document.querySelectorAll('[data-k]').forEach(el=>{el.value=S.f[el.dataset.k]??''});
  document.querySelectorAll('[data-c]').forEach(el=>{el.checked=!!S.c[el.dataset.c]});
  renderPh();
}
async function newCont(){if(!await ask('بدء حاوية جديدة؟ البيانات الحالية هتتمسح من الشاشة.'))return;phClear(S.id);S=blank();build();fill();changed();scrollTo(0,0)}
function hist(){try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){return[]}}
function showHist(){const h=hist();$('#hist').innerHTML=h.length?h.slice().reverse().map(x=>`<div class="it"><span class="ltr">${esc(x.cont)}</span><span>${esc(x.prod)}</span><span>${esc(x.date)}</span><span>${x.pal} بالتة</span></div>`).join(''):'<div class="msg warn">لا توجد حاويات سابقة على هذا الجهاز.</div>'}

// ---------- report ----------
function missingPhotos(){const m=[];STEPS.forEach((s,i)=>{const ex=EXTRA[s.id]||{};(ex.photos||[]).forEach(([k,l])=>{if(!S.ph[k])m.push((i+1)+'. '+l)});if(ex.driver&&!S.ph.face)m.push((i+1)+'. صورة وجه السائق')});return m}
async function finish(){
  const mp=missingPhotos();
  if(mp.length){$('#missing').innerHTML='<div class="msg bad"><b>لا يمكن إصدار التقرير — صور ناقصة ('+mp.length+'):</b><br>• '+mp.map(esc).join('<br>• ')+'</div>';$('#missing').scrollIntoView({block:'center'});return}
  const miss=[];const ii=infoIssues();if(ii.length)miss.push(['بيانات الحاوية',ii]);
  STEPS.forEach((s,i)=>{const x=stepIssues(s);if(x.length)miss.push([(i+1)+'. '+s.t,x])});
  if(miss.length){
    $('#missing').innerHTML='<div class="msg bad"><b>لا يمكن إنهاء التحميل — ناقص:</b>'+miss.map(([t,x])=>`<div style="margin-top:4px"><b>${t}</b><br>• ${x.map(esc).join('<br>• ')}</div>`).join('')+'</div>';
    if(!await ask('فيه بنود ناقصة. تصدر التقرير برضه وتظهر فيه النواقص؟'))return;
  }else $('#missing').innerHTML='';
  try{const h=hist();if(!h.find(x=>x.id===S.id))h.push({id:S.id,cont:(S.f.cont||'').toUpperCase(),prod:prodName(),date:S.f.date,pal:S.f.expPal||'—'});localStorage.setItem(HK,JSON.stringify(h.slice(-200)))}catch(e){}
  report(miss);
}
function prodName(){return S.prod==='frozen'?'فراولة مجمدة':S.prod==='citrus'?'موالح':'—'}
function row(k,v){return `<tr><th>${k}</th><td>${v}</td></tr>`}
function report(miss){
  const f=S.f,L=lots(),T=temps(),lim=tempLimit();
  const ph=(k,cap)=>S.ph[k]?`<figure><img src="${S.ph[k]}"><figcaption>${cap}</figcaption></figure>`:'';
  const caps={out:'الخارج — صورة 1',out2:'الخارج — صورة 2',in:'الداخل يمين — 1',in4:'الداخل يمين — 2',in2:'الداخل شمال — 1',in5:'الداخل شمال — 2',in3:'الداخل الصدر — 1',in6:'الداخل الصدر — 2',unit:'جهاز ضبط الحاوية',drain:'فتحات الصرف',logger:'جهاز التبريد داخل الكرتونة',label:'ورقة «هنا جهاز تبريد»',last:'آخر البالتات واللوطات',samples:'عينات اللوط',seal:'القفلة مع رقم الحاوية'};
  const hd=(t)=>`<div class="hd"><h2>${t}</h2><div>حاوية: <b class="ltr">${esc((f.cont||'').toUpperCase())}</b> · ${esc(f.date||'')}</div></div>`;
  const top=`<div class="noprint"><button class="btn" id="pdfBtn" onclick="savePdf()">حفظ PDF</button><button class="btn" onclick="closeRep()">رجوع</button></div><div id="pdfMsg" class="noprint" style="display:none;background:#fff;color:var(--ink);font-size:13px"></div>`;
  const B='<!--B-->',P='<!--P-->';
  let h='';
  h+=hd('تقرير تحميل حاوية');
  h+=`<table>${row('الصنف',prodName())}${row('العميل',esc(f.client))}${row('رقم الحجز',`<span class="ltr">${esc(f.booking)}</span>`)}${row('الخط الملاحي',esc(f.line==='أخرى'?f.lineOther:f.line))}
  ${row('درجة الحجز',`<span class="ltr">${esc(f.setp)} °C</span>`)}${row('عدد البالتات',esc(f.expPal||'—'))}${row('جهاز التبريد',`رقم <span class="ltr">${esc(f.logger)}</span> ${f.loggerPal?' — الباليت <span class="ltr">'+esc(f.loggerPal)+'</span>':''} (الباليت قبل الأخير، فوق، داخل الكرتونة)`)}
  ${row('وقت التحميل',`${esc(f.tStart)} — ${esc(f.tEnd)}`)}${row('رقم السيارة / السائق',esc(f.truck)+' / '+esc(f.drvName))}${row('مهندس التحميل',esc(f.eng))}</table>`;
  h+=B;
  h+=`<h4>الخطوات</h4><table>`+STEPS.map((s,i)=>{const x=stepIssues(s);return `<tr><th>${i+1}. ${s.t}</th><td>${x.length?'<span class="no">ناقص:</span> '+x.map(esc).join(' · '):'<span class="yes">✓ تم</span>'}</td></tr>`}).join('')+`</table>`;
  h+=B;
  h+=`<h4>حرارة الثمرة (معاينة)</h4><table>${row('القراءة',T.length?`<span class="ltr">${T[0]} °C</span>`:'—')}${row('درجة الحجز',`<span class="ltr">${esc(f.setp)} °C</span>`)}</table>`;
  h+=B;
  h+=`<h4>اللوطات</h4><table>${row('اللوطات',`<span class="ltr">${esc(L.join(', '))||'—'}</span>`)}${row('آخر 4 بالتات',`<span class="ltr">${[1,2,3,4].map(n=>esc(f['l'+n]||'—')).join(' | ')}</span>`)}${row('عينات للسائق',esc(f.samples||'—')+' كرتونة')}</table>`;
  const figs=Object.keys(caps).map(k=>ph(k,caps[k])).filter(Boolean);
  if(figs.length){h+=P+hd('صور التحميل');for(let r=0;r<figs.length;r+=3){h+=(r?B:'')+`<div class="pics">${figs.slice(r,r+3).join('')}</div>`}}
  h+=P+`${hd('توقيع السائق باستلام الورق')}
  <p>أقر أنا السائق الموقع أدناه باستلام <b>ورقة سلامة الغذاء</b> الخاصة بالحاوية رقم <b class="ltr">${esc((f.cont||'').toUpperCase())}</b>
  ${L.length?`، وعدد <b>${esc(f.samples||'')}</b> كرتونة عينة (لوط: <span class="ltr">${esc(L.join(', '))}</span>)`:''}.</p>
  <table>${row('اسم السائق',esc(f.drvName))}${row('رقم التليفون / الرخصة',`<span class="ltr">${esc(f.drvId)}</span>`)}${row('رقم السيارة',esc(f.truck))}${row('التاريخ',esc(f.date))}</table>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
   <div style="border:1px solid var(--line);padding:6px;text-align:center"><div>توقيع السائق</div>${S.sig?`<img src="${S.sig}" style="width:100%;max-height:170px;object-fit:contain">`:'<div class="no" style="padding:40px 0">بدون توقيع</div>'}</div>
   <div style="border:1px solid var(--line);padding:6px;text-align:center"><div>صورة السائق</div>${S.ph.face?`<img src="${S.ph.face}" style="width:100%;max-height:240px;object-fit:contain">`:'<div class="no" style="padding:40px 0">بدون صورة</div>'}</div>
  </div><p style="margin-top:22px">مهندس التحميل: ${esc(f.eng)} &nbsp;&nbsp;&nbsp; التوقيع: ....................</p>`;
  REP_HTML=h;
  const scr='<div class="rp">'+h.split(P).join('<div class="pb"></div>').split(B).join('')+'</div>';
  $('#rep').innerHTML=top+LH_HEAD+wrapLay(scr)+LH_FOOT;$('#app').style.display='none';$('#rep').style.display='block';scrollTo(0,0);
  document.title='تقرير تحميل '+(f.cont||'').toUpperCase();
}

// ---------- dialog (confirm() is blocked inside the link) ----------
function ask(msg){return new Promise(res=>{const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<div class="dbox"><p>${esc(msg)}</p><div class="g2"><button class="btn p">نعم</button><button class="btn">لا</button></div></div>`;
  const bs=d.querySelectorAll('button');bs[0].onclick=()=>{d.remove();res(true)};bs[1].onclick=()=>{d.remove();res(false)};document.body.appendChild(d)})}

// ---------- PDF ----------
let REP_HTML='';
function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
function buildPages(){
  const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;width:794px';document.body.appendChild(wrap);
  const pages=[];let body;
  const newPage=()=>{const p=document.createElement('div');p.className='pg794';p.innerHTML=LH_HEAD+'<div class="pbody rp"></div>'+LH_FOOT;wrap.appendChild(p);pages.push(p);body=p.querySelector('.pbody')};
  newPage();
  REP_HTML.split('<!--P-->').forEach((sec,si)=>{
    if(si>0&&body.children.length) newPage();
    sec.split('<!--B-->').forEach(b=>{if(!b.trim())return;
      const t=document.createElement('div');t.innerHTML=b;const nodes=[...t.childNodes];
      const box=document.createElement('div');nodes.forEach(n=>box.appendChild(n));body.appendChild(box);
      if(body.scrollHeight>body.clientHeight+1&&body.children.length>1){box.remove();newPage();body.appendChild(box)}
    });
  });
  return {wrap,pages};
}
async function savePdf(){
  const m=$('#pdfMsg'),btn=$('#pdfBtn');const say=t=>{m.style.display=t?'block':'none';m.textContent=t||''};
  if(!window.claude||!window.claude.use){try{window.print()}catch(e){say('من قائمة المتصفح اختار طباعة ← حفظ PDF.')}return}
  btn.disabled=true;say('جاري تجهيز الـ PDF…');
  try{
    const dl=await window.claude.use('downloads');
    if(!dl){say('حفظ الـ PDF غير متاح هنا — افتح اللينك في المتصفح.');return}
    if(!window.html2canvas) await loadJS('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await loadJS('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await document.fonts.ready;
    const {wrap,pages}=buildPages();
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
    for(let i=0;i<pages.length;i++){
      say(`جاري تجهيز الصفحة ${i+1} من ${pages.length}…`);
      const c=await html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.86),'JPEG',0,0,210,297);
    }
    wrap.remove();
    const name='تقرير تحميل '+((S.f.cont||'').toUpperCase()||'حاوية')+'.pdf';
    say('');
    await dl.save({filename:name,data:pdf.output('blob')});
    say('تم حفظ الـ PDF ✓');
  }catch(e){
    const c=e&&e.code;
    say(c==='declined'?'تم إلغاء الحفظ.':c==='rate_limited'?'استنى ثواني وجرّب تاني.':(e&&e.message==='load')?'محتاج نت لتجهيز الـ PDF — جرّب تاني.':'حصلت مشكلة في تجهيز الـ PDF — جرّب تاني.');
  }finally{btn.disabled=false}
}

function closeRep(){$('#rep').style.display='none';$('#app').style.display='block';document.title='شيك ليست التحميل'}

load();build();fill();changed();loadMedia();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
